# Run scvd.store's free x402 preflight against your own door after every
# deploy and once a week. It reads the 402 challenge and the signed
# offer; it does not pay, does not certify, and does not watch the door
# between runs. Copy into .github/workflows/ and set X402_DOOR.
#
# The request is one POST with {"url": ...}; the reply is JSON with a
# verdict and the named checks. Docs: https://scvd.store/developers
name: x402 endpoint preflight

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: "0 9 * * 1"

env:
  X402_DOOR: https://example.com/paid-endpoint

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight the door
        run: |
          curl -sS -X POST https://scvd.store/api/preflight/v1 \
            -H "content-type: application/json" \
            --data "{\"url\":\"$X402_DOOR\"}" | tee preflight.json
      - name: Fail the job if the door is not ready
        run: |
          node -e '
            const r = require("./preflight.json");
            console.log(JSON.stringify(r, null, 2));
            if (r.verdict && r.verdict !== "ready") process.exit(1);
          '
