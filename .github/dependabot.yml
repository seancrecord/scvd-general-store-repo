# THE STALENESS THIS EXISTS FOR was demonstrated the day before it
# was added: wrangler sat 90 minors behind until an outside scanner
# flagged a CVE in the old version, and hono was one minor short of a
# patched ReDoS. A dependency-update tool is the mechanism that makes
# "we keep dependencies current" true without anyone remembering to.
#
# PRs only — nothing merges itself. The keeper's hand stays on every
# change (house rule 30), this just queues the work with the diff and
# the advisory attached.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      x402-family:
        patterns:
          - "@x402/*"
          - "@coinbase/*"
      cloudflare-tooling:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # THE SPLIT THIS EXISTS FOR happened on 2026-09-15: codeql-action
      # ships init, analyze and upload-sarif from one repo at one version,
      # and ungrouped Dependabot filed a PR per path (#697, #698, #699).
      # The action refuses to run when init and analyze disagree, so the
      # two halves of codeql.yml each failed `analyze` on their own and
      # neither could go green until the other was merged. Lockstep
      # dependencies belong in one PR or they arrive unmergeable.
      codeql:
        patterns:
          - "github/codeql-action*"
      # Volume, not correctness: the first-party actions move often and
      # independently, and five one-line PRs a week is how a queue stops
      # being read. Third-party actions stay ungrouped on purpose — a
      # supply-chain bump deserves its own diff and its own decision.
      actions-core:
        patterns:
          - "actions/*"
