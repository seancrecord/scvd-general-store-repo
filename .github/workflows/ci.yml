# THE STORE SAID THIS EXISTED BEFORE IT DID.
#
# /try tells every visitor "CI validates the catalog against it on
# every build", and /schemas/listing-spec-v1.json says field order is
# "validated in CI". Both were false on 2026-07-29: 354 tests, and
# nothing ran them except a hand. The tests were real; the sentence
# describing when they run was not.
#
# Same class as "refunds are automatic" — a true-sounding claim about
# our own machinery that no machinery backed. Caught the same way,
# too: somebody went looking for the thing and it wasn't there.
#
# This file is that claim becoming true.
name: CI

# Least privilege (OpenSSF Token-Permissions): this workflow only
# reads the repo; nothing here writes to GitHub.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The suite walks every public claim the store makes: the naming
      # law across seven surfaces, the listing spec's field order, the
      # refund wording, the decline readings, and the skill document
      # against the live menu. A red build means the store is saying
      # something it cannot do.
      - name: Tests
        run: npm test
      # THE TAB'S OWN TESTS — a filesystem product cannot run in the
      # Workers pool (no fs in an isolate), so scvd-tab tests ride
      # Node's own runner. Zero framework, same as zero dependencies.
      - name: The Tab (scvd-tab MCP server)
        run: npm run tab:test
      # THE SCALABILITY AUDIT — the same idea pointed forward instead of
      # backward. The tests catch a claim that is false NOW; this catches
      # a shape that will quietly become false as the store grows. Its
      # first run found ten KV listings with no limit, which Cloudflare
      # answers with one page and a flag nothing was reading — readings
      # that would have stopped seeing older records with no error and
      # no warning, at some unknown future size.
      - name: Scalability audit
        run: npm run audit
      # WHICH DOCUMENTS HAVE GONE QUIET — printed, never enforced.
      # The facts a machine can recompute are already guarded by tests
      # that fail this build (doc-drift for outbound copy,
      # derived-not-typed for served surfaces, skill-parity and
      # published-record for the bundle). What is left is the judgment
      # call no test can make, and it only reaches the keeper if it
      # rides a job he already reads.
      #
      # IT MUST NOT FAIL THE BUILD. A red build for a quiet document
      # would be answered by touching the file, and a freshness check
      # that can be satisfied by touching a file manufactures fake
      # freshness — the exact failure the store's own dated surfaces
      # exist to avoid.
      - name: Documents that have gone quiet
        run: npm run docs:check
      # DOES IT ACTUALLY BUILD — added 2026-07-30, the same day a green
      # CI shipped nothing. The tests run under vite, which serves a
      # `?raw` markdown import happily; wrangler builds with esbuild,
      # which has no .md loader and refused. So typecheck passed, 485
      # tests passed, the audit passed, and every deploy after that
      # commit failed silently while the branch looked healthy.
      #
      # A suite that cannot fail on an unbuildable Worker is measuring
      # the wrong artifact. This step builds the thing that actually
      # ships.
      - name: Build
        run: npm run build:check

  # THE RED LIGHT THAT TELLS SOMEBODY (2026-08-07, the keeper's ask for
  # enforcement that costs him nothing per push). main sat red for two
  # days on a real audit failure and no one was told: the store pages
  # its keeper about undelivered sales and chain dust, and said nothing
  # about its own CI. These two jobs are that alert, using the only
  # channel a workflow gets without new secrets — an issue that opens
  # when a push to main goes red and closes itself on the next green.
  # An open issue titled "CI is red on main" IS the state, visible to
  # every session and agent that reads the repo, which is more than an
  # email is.
  #
  # Least privilege holds: only these two jobs get issues:write; the
  # check job keeps contents:read and nothing else changed.
  red-main:
    needs: check
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = "CI is red on main";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-red",
            });
            const body = [
              `Push \`${context.sha.slice(0, 7)}\` failed CI on main: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "This issue closes itself on the next green push to main. If it has been open more than a day, the books' own rule applies: a red light nobody answers teaches everybody to disbelieve red lights.",
            ].join("\n");
            const existing = open.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ci-red"],
              });
            }

  green-main:
    needs: check
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-red",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Green again at \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
