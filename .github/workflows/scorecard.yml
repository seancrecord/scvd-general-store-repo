# OpenSSF Scorecard — an independent, automated read of this repo's
# security posture, published to the public dataset so anyone can query
# it at api.securityscorecards.dev without taking our word for it.
#
# HOUSE RULE, SAME AS EVERYWHERE: we report the real score. We do not
# add scaffolding we don't need to inflate it — a low score on an
# honest check beats a gamed high one, and /corrections exists precisely
# so numbers stay true rather than flattering.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF dataset so the badge resolves
          # and the score is independently queryable. Opt-in, no secret.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
