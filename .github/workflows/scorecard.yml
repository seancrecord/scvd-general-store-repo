# OpenSSF Scorecard — an independent, automated read of this repo's
# security posture, published to the public dataset so anyone can query
# it at api.securityscorecards.dev without taking our word for it.
#
# HOUSE RULE, SAME AS EVERYWHERE: we report the real score. We do not
# add scaffolding we don't need to inflate it — a low score on an
# honest check beats a gamed high one, and /corrections exists precisely
# so numbers stay true rather than flattering.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF dataset so the badge resolves
          # and the score is independently queryable. Opt-in, no secret.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: results.sarif
