# OpenSSF Scorecard — an independent, automated read of this repo's
# security posture, published to the public dataset so anyone can query
# it at api.securityscorecards.dev without taking our word for it.
#
# HOUSE RULE, SAME AS EVERYWHERE: we report the real score. We do not
# add scaffolding we don't need to inflate it — a low score on an
# honest check beats a gamed high one, and /corrections exists precisely
# so numbers stay true rather than flattering.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF dataset so the badge resolves
          # and the score is independently queryable. Opt-in, no secret.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
