# THE PYTHON HALF OF "ONE LAW IN THREE LANGUAGES".
#
# scvd-preflight went to npm the day it was written and nowhere else.
# An outside readiness scan counted that honestly: an SDK in one
# package manager is an SDK for the people who already use that one.
# The Go port needs no registry — a module publishes by git tag — so
# this file exists for PyPI alone.
#
# TRUSTED PUBLISHING, NOT A TOKEN. PyPI accepts a short-lived OIDC
# credential minted by this workflow, so there is no PYPI_TOKEN to
# store, rotate, or leak, and the provenance is the same shape the npm
# publisher already relies on. It has to be configured once on PyPI's
# side before the first run:
#
# THE PROJECT DOES NOT EXIST ON PyPI YET, so this is a PENDING
# publisher, not a trusted publisher on an existing project. They are
# different forms in different places, and the project-level one is
# unreachable until a first release exists — which cannot happen until
# this is configured. The pending form is what breaks that circle: it
# authorises a publisher for a name nobody has claimed, and the first
# successful run creates the project and converts it automatically.
#
#   1. https://pypi.org/manage/account/publishing/ — that exact page,
#      NOT the project view. (PyPI requires 2FA on the account.)
#   2. Under "Add a new pending publisher", GitHub tab:
#        PyPI Project Name: scvd-preflight
#        Owner:             seancrecord
#        Repository name:   scvd-general-store-repo
#        Workflow name:     publish-pypi.yml
#        Environment name:  leave blank
#      The workflow name is the FILENAME, not a path and not the
#      `name:` field below.
#
# Until that exists the publish step fails with a 403 from PyPI and
# nothing is uploaded, which is the correct failure: a publisher that
# was never authorised should not be able to guess its way in.
name: Publish PyPI package

# Least privilege (OpenSSF Token-Permissions). `id-token: write` is
# granted on the job, not here — it is the whole authentication story.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        type: choice
        options:
          - scvd-preflight
      # NO DEFAULT, ON PURPOSE — the same reasoning as the npm and
      # skill publishers. A prefilled version is a number that reads as
      # current because nothing marks it as old, and one tap on a phone
      # would ship it.
      version:
        description: "Version being published — must match that package's pyproject.toml"
        required: true
        type: string
      dry_run:
        description: "Build and check everything, publish nothing"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing, via GitHub OIDC. No secret.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the package directory
        id: resolve
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            scvd-preflight) DIR=x402-preflight-py ;;
            *) echo "::error::No directory mapped for $PACKAGE"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE from $DIR/"

      # THE REFUSAL THAT MAKES THE TYPED VERSION WORTH TYPING, the same
      # three as the npm publisher: the name in pyproject.toml
      # disagrees with the button, the version disagrees with what was
      # typed, or that version is already on PyPI.
      - name: Check the package against what you typed
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DIR: ${{ steps.resolve.outputs.dir }}
        run: |
          NAME=$(python -c "import tomllib,sys; print(tomllib.load(open('$DIR/pyproject.toml','rb'))['project']['name'])")
          FILE_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('$DIR/pyproject.toml','rb'))['project']['version'])")
          if [ "$NAME" != "$PACKAGE" ]; then
            echo "::error::$DIR/pyproject.toml is named $NAME, not $PACKAGE."
            exit 1
          fi
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::You typed $VERSION; $DIR/pyproject.toml says $FILE_VERSION. Bump the file in a commit first — this workflow confirms a version, it does not set one."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "::error::$PACKAGE $VERSION is already on PyPI. Versions are immutable there; bump and try again."
            exit 1
          fi
          echo "$PACKAGE $VERSION is new. Proceeding."

      # The package is standard library only, so this installs nothing
      # of the package's own and its supply chain stays empty. The
      # tests run anyway: a broken wheel is not worth a registry slot,
      # and these take milliseconds.
      - name: Run the package's own tests
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: python -m unittest discover -s tests

      - name: Build the wheel and the sdist
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist

      # Print what would be uploaded BEFORE anything is sent. A PyPI
      # publish is irreversible in practice — a yanked version keeps its
      # number forever — so the last cheap moment to notice a stray
      # file is here. `twine check` also catches the README failing to
      # render, which PyPI accepts silently and then displays as raw
      # text on the project page.
      # TWINE IS PINNED HERE, AND IT IS PINNED TO THE ACTION'S TWINE.
      #
      # THE BUG THIS EXISTS TO PREVENT, 2026-09-16. This step used to
      # `pip install twine` unpinned, which resolved to 7.0.0 and
      # passed. The publish step then handed the same wheel to the
      # action's OWN bundled twine — 6.1.0 at the version pinned then —
      # which rejected it: hatchling writes `Metadata-Version: 2.5` and
      # twine did not learn that version until 7.0.0. So the dry run
      # said yes and the real run said no, about the same file, on the
      # same commit, minutes apart.
      #
      # That is worse than no dry run. A rehearsal that validates with a
      # DIFFERENT tool than the one gating the real thing cannot predict
      # the real thing, and its green tick reads as though it can. The
      # pin makes the rehearsal use the gate's own tool.
      #
      # IF YOU BUMP THE ACTION BELOW, BUMP THIS TO MATCH. Read the
      # version out of that release's requirements/runtime.txt; do not
      # guess it. The two drifting apart is the exact failure above.
      - name: Show exactly what would be published
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          python -m pip install --quiet 'twine==7.0.0'
          python -m twine --version
          ls -l dist
          python -m twine check dist/*
          python -c "import zipfile,glob; w=glob.glob('dist/*.whl')[0]; [print(n) for n in sorted(zipfile.ZipFile(w).namelist())]"

      # v1.14.2, NOT v1.12.4, AND THE REASON IS THE WHOLE STORY ABOVE.
      # The action runs its own twine check inside its container before
      # it uploads, using the twine IT pins — v1.12.4 pinned twine
      # 6.1.0, which predates core metadata 2.5 and refused the wheel.
      # v1.14.2 pins twine 7.0.0; its release notes say in as many
      # words that it exists to make metadata 2.5 publishable.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ steps.resolve.outputs.dir }}/dist

      - name: Say what happened
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run — nothing was published"
              echo ""
              echo "\`$PACKAGE $VERSION\` passed every check; the wheel contents are in the log above."
              echo "Run again with **dry_run unchecked** to publish it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Published \`$PACKAGE $VERSION\`"
              echo ""
              echo "- https://pypi.org/project/$PACKAGE/$VERSION/"
              echo "- Uploaded by Trusted Publishing: no token was stored or used."
              echo "- PEP 740 attestations are on by default from action v1.14.2, so the uploaded files carry signed provenance binding them to this repo, commit and workflow — the same bar \`npm publish --provenance\` holds our npm packages to."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
