# SAST (OpenSSF Scorecard's word for it): CodeQL over the TypeScript,
# on every push to main, every PR, and a weekly sweep — a second
# reader of the code that is not us and not our tests. The suite
# proves the store does what it claims; this hunts for the class of
# defect nobody wrote a claim about.
#
# The three actions here are commit-SHA pinned like the rest of the
# workflows, with the version in a trailing comment. codeql-action's
# init and analyze must carry the SAME SHA: the action refuses to run
# when the halves disagree, which is why .github/dependabot.yml groups
# them into one PR.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
