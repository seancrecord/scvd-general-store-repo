# SAST (OpenSSF Scorecard's word for it): CodeQL over the TypeScript,
# on every push to main, every PR, and a weekly sweep — a second
# reader of the code that is not us and not our tests. The suite
# proves the store does what it claims; this hunts for the class of
# defect nobody wrote a claim about.
#
# Actions here are version tags rather than the commit-SHA pinning
# the other workflows use: this session's tooling cannot resolve SHAs
# for repositories outside its scope. Pin them when hands allow —
# Scorecard's Pinned-Dependencies check will name them until then.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
