# Mirror the newest signed round to Zenodo and Hugging Face, daily at
# 09:00 UTC, or by hand. The walk is scheduled for Sundays at 11:00 UTC,
# but rounds have landed on a Monday, a Tuesday and a Wednesday too
# (rounds 3 to 6), and a once-a-week run on Monday morning saw each of
# those a week late. Running daily costs nothing on a quiet day: the
# script asks each mirror what it holds and says "nothing to send".
# Both mirrors are optional: a missing token skips that mirror with a
# line saying so. scripts/corpus-publish.mjs; secrets ZENODO_TOKEN and
# HF_TOKEN in the repository's Actions secrets.
name: corpus publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Mirror the newest round
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/corpus-publish.mjs
