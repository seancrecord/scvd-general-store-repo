[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scvd-preflight"
version = "0.1.0"
description = "Zero-dependency client for scvd.store's free x402 preflight: one probe per door, every check named, the remediation rows, and the deploy gate's exit law."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "scvd.store" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["x402", "preflight", "402", "payment-required", "agent-payments", "deploy-gate", "usdc", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://scvd.store/api/preflight/v2"
Repository = "https://github.com/seancrecord/scvd-general-store-repo"
Issues = "https://github.com/seancrecord/scvd-general-store-repo/issues"

[project.scripts]
scvd-preflight = "scvd_preflight.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scvd_preflight"]
